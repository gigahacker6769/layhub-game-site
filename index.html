<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">🎮 PlayHub</div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search games..." onkeyup="filterGames()">
    </div>
  </header>

  <nav class="categories">
    <button class="cat-btn active" onclick="filterCategory('all')">All</button>
    <button class="cat-btn" onclick="filterCategory('Action')">Action</button>
    <button class="cat-btn" onclick="filterCategory('Arcade')">Arcade</button>
  </nav>

  <main>
    <div class="game-grid" id="gameGrid"></div>
  </main>

  <!-- Modal Player -->
  <div id="playerModal" class="modal">
    <div class="modal-content">
      <div class="modal-controls">
        <button onclick="toggleFullscreen()" class="fullscreen-btn">⛶ Fullscreen</button>
        <button onclick="closeGame()" class="close-btn">✖ Close</button>
      </div>
      <iframe id="gameFrame" src="" allowfullscreen allow="autoplay"></iframe>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
